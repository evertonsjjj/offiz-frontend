<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="256" height="256" role="img" aria-label="Offiz">
  <!-- A MARCA DO OFFIZ — o "O" de andares. Tem que ser o MESMO desenho de
       src/components/LogoMark.tsx: este arquivo é o ícone da aba do navegador,
       e uma aba com uma marca e a página com outra é o pior lugar possível
       para as duas divergirem.
       Até 14/08/2026 este arquivo era a identidade ANTERIOR — gradiente roxo
       (#5a3ff5 → #2a16a0) com a gem de nós em lavanda (#c7c2ff) —, enquanto o
       app já tinha virado creme e azul de trabalho fazia um mês. -->
  <defs>
    <linearGradient id="offizAzul" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a62d8"></stop>
      <stop offset="1" stop-color="#24409a"></stop>
    </linearGradient>
    <linearGradient id="offizCreme" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdf8"></stop>
      <stop offset=".6" stop-color="#f4efe6"></stop>
      <stop offset="1" stop-color="#e6dfd2"></stop>
    </linearGradient>
    <mask id="offizRecorte">
      <rect width="100" height="100" fill="#000"></rect>
      <circle cx="50" cy="50" r="22.5" fill="none" stroke="#fff" stroke-width="15"></circle>
      <rect x="18" y="40" width="64" height="4.6" fill="#000"></rect>
      <rect x="18" y="55.4" width="64" height="4.6" fill="#000"></rect>
    </mask>
  </defs>
  <rect x="3" y="3" width="94" height="94" rx="27" fill="url(#offizAzul)" stroke="rgba(244,239,230,.32)" stroke-width="1"></rect>
  <rect width="100" height="100" fill="url(#offizCreme)" mask="url(#offizRecorte)"></rect>
</svg>
